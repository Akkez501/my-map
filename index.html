<!DOCTYPE html>
<html>
<head>
  <title>Leaflet Map with Image Popup</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    #map {
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Initialize the map
  var map = L.map('map').setView([45.373951, -75.723274], 14);

  // Add base layer
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  // Add marker with working image popup
  var marker = L.marker([45.373951, -75.723274]).addTo(map);
  marker.bindPopup(
    '<b>Monarch Cricket Club</b><br><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/13/Cricket_pitch_in_the_summer.jpg/640px-Cricket_pitch_in_the_summer.jpg" width="250">'
  );
</script>

</body>
</html>
