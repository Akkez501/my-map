<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaflet Map with 3D Buildings</title>
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-gl@0.3.0/leaflet-gl.js"></script>
  <style>
    #map {
      height: 100vh; /* Full-screen map */
    }
  </style>
</head>
<body>

<!-- Map Container -->
<div id="map"></div>

<script>
  // Initialize map
  var map = L.map('map').setView([45.373951, -75.723274], 14); // Example: Monarch Cricket Club, Ottawa

  // Add OpenStreetMap base layer
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Add 3D buildings layer using Leaflet-GL
  var glLayer = L.glify.layer({
    map: map,
    attribution: '3D buildings with Leaflet-GL',
    style: {
      buildingColor: '#2d2d2d',
      extrude: true,
    },
    data: 'https://raw.githubusercontent.com/leaflet-extras/leaflet-glify/master/examples/3d-buildings.geojson' // Example GeoJSON for 3D buildings
  });

  glLayer.addTo(map);
</script>

</body>
</html>
